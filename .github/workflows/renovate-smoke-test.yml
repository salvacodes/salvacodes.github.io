name: Renovate Smoke Test
on:
  push:
    branches:
      - 'renovate/**'

concurrency:
  group: 'renovate-smoke-test-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Test
        run: npm run test
